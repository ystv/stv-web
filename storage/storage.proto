syntax = "proto3";
package storage;
option go_package = "github.com/ystv/stv-web/storage";

message STV {
    repeated Session sessions = 1;
    repeated Ballot ballots = 2;
    repeated Candidate candidates = 3;
    repeated Election elections = 4;
    repeated URL urls = 5;
    bool allowRegistration = 6;
}

message Session {
    bytes hash = 1;
    string name = 2;
    string email = 3;
    bool registered = 4;
    string access = 5;
}

message Ballot {
    string id = 1;
    string election = 2;
    map<uint64, string> choice = 3; // map[order, candidate id]
}

message Candidate {
    string id = 1;
    string election = 2;
    string name = 3;
}

message Election {
    string id = 1;
    string name = 2;
    string description = 3;
    bool ron = 4;
    uint64 seats = 5;
    bool open = 6;
    bool closed = 7;
    Result result = 8;
    repeated Session excluded = 9;
    uint64 voters = 10;
}

message Result {
    uint64 rounds = 1;
    repeated string winners = 2;
    repeated Round round = 3;
}

message Round {
    uint64 round = 1;
    uint64 blanks = 2;
    repeated CandidateStatus candidateStatus = 3;
}

message CandidateStatus {
    uint64 candidateRank = 1;
    string id = 2;
    double noOfVotes = 3;
    string status = 4;
}

message URL {
    string url = 1;
    string election = 2;
    bytes voter_hash = 3;
    bool voted = 4;
}

